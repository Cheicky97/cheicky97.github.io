    Projects:
      - name: Ph.D. Simulation Data Analysis Toolkit
        summary: >
          Scientific software and analysis workflows developed in Fortran and
          Python to process first-principles molecular-dynamics trajectories,
          calculate physical observables, and automate research workflows.
        highlights:
          - "Developed and maintained a modular Fortran package over the course of the Ph.D."
          - "Implemented numerical analysis and post-processing routines for atomistic simulations"
          - "Integrated Python scripts for data analysis, visualisation, and workflow automation"
        url: "https://github.com/cheick-oumar-diarra/PhD-Data-Analysis"

      - name: Defensin Protein Data Pipeline
        summary: >
          Python workflow for collecting, integrating, and analysing protein
          sequence data and disulfide-bond annotations to study defensin folding.
        highlights:
          - "Automated data retrieval through the UniProt REST API"
          - "Built structured Pandas datasets from heterogeneous biological annotations"
          - "Performed statistical exploration of sequence and disulfide-bond features"

