cv:
  name: Cheick O. DIARRA
  label: Computational Physicist | Scientific Computing | Data-Driven Research
  email: cheickoumard7@gmail.com
  location: Orléans, France
  image: ""
  summary: >
    Computational physicist with a Ph.D. and expertise in molecular modelling,
    scientific computing, and data-driven research. Experienced in developing
    numerical methods and scientific software in Fortran, Python, and Bash for
    the analysis of ab initio simulations, the automation of HPC workflows,
    and the processing of scientific data. My background combines atomistic
    modelling, scientific software development, high-performance computing on
    GENCI facilities, and machine learning through hands-on projects.

  social_networks:
    - network: GitHub
      username: cheick-oumar-diarra
    - network: LinkedIn
      username: cheick-diarra
    - network: ResearchGate
      username: Cheick-Diarra

  address:
    street: Rue Charles Sadron
    city: Orléans
    region: Centre-Val de Loire
    postalCode: "45100"
    countryCode: FR

  sections:
    Experience:
      - company: Centre for Molecular Biophysics (CBM)
        position: Teaching and Research Assistant (ATER)
        location: University of Orléans, France
        start_date: 2024
        end_date: present
        summary: >
          Development of computational tools to investigate the role of
          disulfide bonds in the folding of defensin proteins, alongside
          undergraduate and graduate teaching in physics, mathematics, and
          scientific computing.
        highlights:
          - "Developed Python tools to retrieve, structure, and analyse protein sequence data and disulfide-bond annotations"
          - "Built automated data-processing workflows using the UniProt REST API, Pandas, and scientific Python libraries"
          - "Created structured datasets integrating protein sequences, annotations, and custom molecular descriptors"
          - "Performed statistical analyses of correlations and distributions related to disulfide-bond formation"
          - "Used Git and GitHub to organise code, track changes, and support reproducible research"
          - "Taught thermodynamics, mechanics, optics, electrostatics, electronics, complex analysis, Fourier and Laplace transforms, and scientific computing"
          - "Supervised tutorials, laboratory sessions, oral assessments, and student projects across undergraduate and graduate programmes"

      - company: ICube Laboratory
        position: Doctoral Researcher
        location: University of Strasbourg, France
        start_date: 2021
        end_date: 2024
        summary: >
          Development of first-principles computational methods for modelling
          exciton dynamics and thermal transport in organic semiconductors.
          The Ph.D. project was conducted within the ITI HiFunMat doctoral programme.
        highlights:
          - "Developed numerical methods to estimate exciton diffusion properties from first-principles molecular-dynamics trajectories"
          - "Investigated heat-transfer mechanisms and anisotropic thermal transport in organic semiconductors"
          - "Performed Car–Parrinello and ab initio molecular-dynamics simulations on GENCI supercomputing facilities"
          - "Developed and maintained a Fortran software package for trajectory analysis and scientific data processing"
          - "Automated simulation, post-processing, and analysis workflows using Python and Bash"
          - "Produced peer-reviewed publications and presented results at national and international scientific meetings"
          - "Collaborated with researchers working in computational materials science, photonics, and organic electronics"

      - company: Matter and Complex Systems Laboratory (MSC)
        position: Research Intern
        location: Sorbonne University, Paris, France
        start_date: 2021
        end_date: 2021
        summary: >
          Experimental study of the dynamic reorganisation of plant-cell
          cytoskeletal structures under geometric confinement using
          microfabrication, microscopy, and image analysis.
        highlights:
          - "Prepared plant-cell samples for fluorescence microscopy experiments"
          - "Designed and fabricated photolithographic moulds for agar-based microwell arrays"
          - "Applied microfluidic and geometric-confinement approaches"
          - "Processed microscopy images and analysed cytoskeletal dynamics"

      - company: Institute of Nanoscience of Paris (INSP) and Saint-Gobain Research
        position: Research Intern
        location: Paris, France
        start_date: 2020
        end_date: 2020
        summary: >
          DFT-based computational study of structural and electronic changes
          in lithium-doped and oxygen-deficient tungsten trioxide for
          electrochromic applications.
        highlights:
          - "Performed DFT and DFT+U calculations on WO3-based structures"
          - "Studied the effects of lithium intercalation on electronic and crystallographic properties"
          - "Investigated oxygen-deficient Li:WO3−x systems"
          - "Analysed and visualised atomistic-simulation results"

      - company: Institute of Nanoscience of Paris (INSP)
        position: Research Intern
        location: Paris, France
        start_date: 2019
        end_date: 2019
        summary: >
          Optical characterisation of gallium arsenide quantum dots and
          numerical calculation of their electronic states.
        highlights:
          - "Performed micro-photoluminescence and photoluminescence-excitation measurements"
          - "Analysed atomic-force microscopy images"
          - "Calculated fundamental and excited electronic states using Mathematica"

      - company: SYRTE, Paris Observatory
        position: Research Intern
        location: Paris, France
        start_date: 2017
        end_date: 2017
        summary: >
          Statistical analysis of meteorological measurements and their
          relationships with astronomical seeing conditions.
        highlights:
          - "Processed and analysed meteorological datasets"
          - "Studied correlations among temperature, humidity, wind, and seeing conditions"
          - "Produced numerical analyses and scientific visualisations"

    Education:
      - institution: University of Strasbourg
        location: Strasbourg, France
        area: Physics and Materials for Energy
        studyType: Ph.D. in Physics
        start_date: 2021
        end_date: 2024
        summary: "First-principles modelling of exciton dynamics and heat transport in organic semiconductors"
        highlights:
